<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Quickest Change Detection Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { background-color: #ffffff; padding: 20px; border-right: 1px solid #dee2e6; height: 100vh; overflow-y: auto; }
        .plot-container { padding: 20px; height: 100vh; overflow-y: auto; }
        .form-label { font-weight: bold; font-size: 0.9rem; margin-top: 10px; }
        .val-display { color: #0d6efd; float: right; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar Controls -->
        <div class="col-md-3 sidebar shadow-sm">
            <h4 class="mb-4">Experimental Deficiencies</h4>
            
            <label class="form-label">Classical photons (Ncoh): <span id="val_Ncoh" class="val-display">1.0</span></label>
            <input type="range" class="form-range" id="Ncoh" min="1" max="100" step="0.1" value="1.0">

            <label class="form-label">Visibility (V): <span id="val_V" class="val-display">1.0</span></label>
            <input type="range" class="form-range" id="V" min="0.01" max="1.0" step="0.01" value="1.0">

            <label class="form-label">Dark Counts (10^x): <span id="val_logD" class="val-display">-8</span></label>
            <input type="range" class="form-range" id="logD" min="-8" max="-1" step="0.1" value="-8">

            <label class="form-label">Intensity fractional change (f): <span id="val_f" class="val-display">0.01</span></label>
            <input type="range" class="form-range" id="f" min="0.01" max="0.99" step="0.01" value="0.01">

            <label class="form-label">Link length (L) [Line Plot Only]: <span id="val_L" class="val-display">0.0</span> km</label>
            <input type="range" class="form-range" id="L" min="0" max="100" step="0.1" value="0.0">

            <label class="form-label">HeatMap Scale Max: <span id="val_maxR" class="val-display">5</span></label>
            <input type="range" class="form-range" id="maxR" min="1" max="1000" step="1" value="5">
        </div>

        <!-- Plots Area -->
        <div class="col-md-9 plot-container">
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <div id="linePlot" style="width:100%; height:500px;"></div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div id="heatmapHomodyne" style="width:100%; height:500px;"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div id="heatmapDisplacement" style="width:100%; height:500px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Constants and Math Functions
    const alpha = 0.2;

    function eta1(L) { return Math.pow(10, -alpha * L / 10); }
    function eta2(L, f) { return (1 - f) * eta1(L); }
    function ExpMinus2r(Na) { return 2 * Na + 1 - 2 * Math.sqrt(Na * (Na + 1)); }

    function HomodyneN(V, Ncoh, L, f) {
        const e1 = Math.sqrt(eta1(L));
        const e2 = Math.sqrt(eta2(L, f));
        return 2 * V * V * Ncoh * Math.pow(e1 - e2, 2);
    }

    function vMeas(eta, Na, V) {
        return V * V * ((eta * ExpMinus2r(Na) + (1 - eta)) / 4) + (1 - V * V) / 4;
    }

    function SqueezedN(Na, V, L, f) {
        const v1 = vMeas(eta1(L), Na, V);
        const v2 = vMeas(eta2(L, f), Na, V);
        // Based on provided Mathematica expression, pure variance shift (coherent term set to 0)
        return 0.5 * (v2 / v1 - 1 - Math.log(v2 / v1));
    }

    function mu1DispN(V, d, Ncoh, L) {
        return 2 * (1 - V) * eta1(L) * Ncoh + d;
    }

    function mu2DispN(V, d, Ncoh, L, f) {
        const e1 = eta1(L);
        const e2 = eta2(L, f);
        return (e1 + e2 - 2 * V * Math.sqrt(e1 * e2)) * Ncoh + d;
    }

    function DisplacementN(V, d, Ncoh, L, f) {
        const mu1 = mu1DispN(V, d, Ncoh, L);
        const mu2 = mu2DispN(V, d, Ncoh, L, f);
        return mu2 * Math.log(mu2 / mu1) - (mu2 - mu1);
    }

    // UI and Plot Logic
    const ids = ['Ncoh', 'V', 'logD', 'f', 'L', 'maxR'];
    const inputs = {};
    const displays = {};

    ids.forEach(id => {
        inputs[id] = document.getElementById(id);
        displays[id] = document.getElementById('val_' + id);
        inputs[id].addEventListener('input', updatePlots);
    });

    function updatePlots() {
        // Read variables
        const Ncoh = parseFloat(inputs['Ncoh'].value);
        const V = parseFloat(inputs['V'].value);
        const logD = parseFloat(inputs['logD'].value);
        const d = Math.pow(10, logD);
        const f = parseFloat(inputs['f'].value);
        const L_line = parseFloat(inputs['L'].value);
        const maxR = parseFloat(inputs['maxR'].value);

        // Update display text
        ids.forEach(id => { displays[id].innerText = inputs[id].value; });

        // Generate data for Line Plot
        const naLine = [];
        const homodyneData = [];
        const squeezedData = [];
        const displacementData = [];
        
        for (let i = 0; i <= 50; i++) {
            let Na = i * 0.1;
            naLine.push(Na);
            homodyneData.push(HomodyneN(V, Ncoh, L_line, f));
            squeezedData.push(SqueezedN(Na, V, L_line, f));
            displacementData.push(DisplacementN(V, d, Ncoh, L_line, f));
        }

        const traceHomodyne = { x: naLine, y: homodyneData, mode: 'lines', name: 'Homodyne Baseline', line: {color: 'red', dash: 'dash', width: 3} };
        const traceSqueezed = { x: naLine, y: squeezedData, mode: 'lines', name: 'Squeezed', line: {color: 'red', width: 3} };
        const traceDisplacement = { x: naLine, y: displacementData, mode: 'lines', name: 'Displacement', line: {color: 'blue', width: 3} };

        Plotly.react('linePlot', [traceHomodyne, traceSqueezed, traceDisplacement], {
            title: `Relative Entropy (L = ${L_line} km, d = ${d.toExponential(2)})`,
            xaxis: { title: 'Number of Squeezed Photons (Na)' },
            yaxis: { title: 'Relative Entropy' },
            margin: { t: 40, b: 40, l: 50, r: 20 },
            legend: { x: 0.6, y: 0.1 }
        });

        // Generate data for Heatmaps
        const naHeat = [];
        const lHeat = [];
        for (let i = 0; i <= 50; i++) naHeat.push(0.001 + i * (5 / 50));
        for (let i = 0; i <= 50; i++) lHeat.push(i * (20 / 50));

        const zHomodyne = [];
        const zDisplacement = [];

        for (let j = 0; j < lHeat.length; j++) {
            const rowH = [];
            const rowD = [];
            for (let i = 0; i < naHeat.length; i++) {
                let sq = SqueezedN(naHeat[i], V, lHeat[j], f);
                let ho = HomodyneN(V, Ncoh, lHeat[j], f);
                let di = DisplacementN(V, d, Ncoh, lHeat[j], f);
                rowH.push(ho === 0 ? 0 : sq / ho);
                rowD.push(di === 0 ? 0 : sq / di);
            }
            zHomodyne.push(rowH);
            zDisplacement.push(rowD);
        }

        const contourConfig = {
            type: 'contour', showscale: false,
            contours: { coloring: 'none', start: 1, end: 1, size: 1 },
            line: { color: 'black', width: 3, dash: 'solid' }, hoverinfo: 'skip'
        };

        // Heatmap 1: Squeezed vs Homodyne
        Plotly.react('heatmapHomodyne', [
            { z: zHomodyne, x: naHeat, y: lHeat, type: 'heatmap', colorscale: 'Viridis', zmin: 0, zmax: maxR },
            { z: zHomodyne, x: naHeat, y: lHeat, ...contourConfig }
        ], {
            title: 'Squeezed / Homodyne Ratio',
            xaxis: { title: 'TMSV ⟨n⟩ (Na)' },
            yaxis: { title: 'L (km)' },
            margin: { t: 40, b: 40, l: 50, r: 20 }
        });

        // Heatmap 2: Squeezed vs Displacement
        Plotly.react('heatmapDisplacement', [
            { z: zDisplacement, x: naHeat, y: lHeat, type: 'heatmap', colorscale: 'Viridis', zmin: 0, zmax: maxR },
            { z: zDisplacement, x: naHeat, y: lHeat, ...contourConfig }
        ], {
            title: 'Squeezed / Displacement Ratio',
            xaxis: { title: 'TMSV ⟨n⟩ (Na)' },
            yaxis: { title: 'L (km)' },
            margin: { t: 40, b: 40, l: 50, r: 20 }
        });
    }

    // Initial render
    updatePlots();
</script>
</body>
</html>
